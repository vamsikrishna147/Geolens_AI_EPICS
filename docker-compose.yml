version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: geolens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  geolens-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geolens-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  geolens-ui:
    build:
      context: ./geolens-ui
      dockerfile: Dockerfile
    container_name: geolens-ui
    ports:
      - "80:80"
    depends_on:
      - geolens-api
    restart: unless-stopped

volumes:
  redis_data:

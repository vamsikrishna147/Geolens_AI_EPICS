<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <rect width="64" height="64" rx="14" stroke="#27272A" stroke-width="1.5"/>

  <!-- Tactical Reticle Corner Accents -->
  <path d="M10 16 V10 H16" stroke="#52525B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M54 16 V10 H48" stroke="#52525B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10 48 V54 H16" stroke="#52525B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M54 48 V54 H48" stroke="#52525B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Earth Globe Core -->
  <circle cx="32" cy="32" r="16" fill="url(#earthGrad)" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- Earth Meridians & Parallels -->
  <ellipse cx="32" cy="32" rx="8" ry="16" fill="none" stroke="#7DD3FC" stroke-width="0.9" opacity="0.6"/>
  <line x1="16" y1="32" x2="48" y2="32" stroke="#7DD3FC" stroke-width="0.9" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="15" ry="7.5" fill="none" stroke="#7DD3FC" stroke-width="0.75" opacity="0.4"/>

  <!-- Elliptical Satellite Orbit Ring (Tilted) -->
  <ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(-28 32 32)" fill="none" stroke="url(#orbitGrad)" stroke-width="1.8" stroke-dasharray="38 8 10 4"/>

  <!-- Orbiting Satellite Indicator -->
  <circle cx="48" cy="23" r="3" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="48" cy="23" r="1.5" fill="#FFFFFF"/>

  <!-- Optical Crosshair Reticle Center -->
  <line x1="32" y1="20" x2="32" y2="25" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="39" x2="32" y2="44" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="25" y2="32" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="32" x2="44" y2="32" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center Pulse Target Point -->
  <circle cx="32" cy="32" r="2.2" fill="#10B981"/>
</svg>